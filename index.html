<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111113" />
    <link rel="shortcut icon" href="img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="76x76" href="img/apple-icon.png" />
    <title>Roosevelt Roulette</title>
  </head>
  <body>
    <main class="machine">
      <h1 class="machine-header">Roosevelt Roulette</h1>
      <div class="controls">
        <select id="category-filter" class="category-filter" aria-label="Filter cocktails by category">
          <option value="">ALL CATEGORIES</option>
        </select>
      </div>
      <div class="reel-frame" id="reel-frame">
        <div class="reel-mask reel-mask--top"></div>
        <div class="reel-mask reel-mask--bottom"></div>
        <div id="reel-track" class="reel-track"></div>
        <div id="empty-state" class="empty-state">
          Pick a category or just hit SPIN.
        </div>
      </div>
      <button id="spin-button" type="button" class="spin-button" aria-label="Spin to get a random cocktail">SPIN</button>
      <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </main>
    <script type="module" src="/src/ts/index.ts"></script>
  </body>
</html>
